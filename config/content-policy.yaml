# Content Governance and Validation Policy
content_policy:
  version: "1.0.0"
  strict_mode: true
  allow_missing_overlays: true  # Catalogue-only skills display clear pending status
  require_fictional_disclaimer: true

educational_status_allowed:
  - "catalogue-only"
  - "draft"
  - "ready"
  - "needs-update"

legal_review_status_allowed:
  - "not-reviewed"
  - "review-pending"
  - "reviewed"
  - "needs-revalidation"

validation_rules:
  no_unresolved_variables: true
  require_safety_guidance: true
  prevent_fabricated_citations: true
  prevent_persisted_matter_data: true
  require_risk_posture_independence: true
